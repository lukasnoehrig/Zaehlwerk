/* ---------- Grundlagen ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-bottom: calc(var(--tab-h) + var(--navi-h) + var(--tab-abstand) + 40px); scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(var(--bg-oben), var(--bg) 220px) var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--f);
  font-size: 1rem;
  line-height: 1.35;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  font-synthesis: none;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--bg-oben);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a, label { touch-action: manipulation; -webkit-touch-callout: none; }
button, .tab { -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { display: block; }

/* ---------- Rahmen ---------- */
.app {
  max-width: 30rem;
  margin: 0 auto;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  padding-block: 0 calc(var(--tab-h) + var(--tab-abstand) + 36px);
}
.app.mit-navi { padding-block-end: calc(var(--tab-h) + var(--navi-h) + var(--tab-abstand) + 46px); }
.view { display: flex; flex-direction: column; gap: var(--s-3); padding-top: var(--s-3); }
.abschnitt { display: flex; flex-direction: column; gap: var(--s-3); margin-top: var(--s-3); }

/* Kopfzeile wie im Referenzbild: Titel, Untertitel mit Badge, rechts Kennzahl */
.kopf { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: var(--s-4) 2px var(--s-2); }
.kopf-text { min-width: 0; }
.kopf h1 { overflow-wrap: anywhere; margin: 0; font-size: 1.625rem; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
.kopf .unter { margin: 4px 0 0; color: var(--text-2); font-size: 0.875rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kopf-rechts { display: flex; align-items: center; gap: var(--s-2); flex: none; }

.badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 5px; font-size: 0.6875rem; font-weight: 700; line-height: 1.3; color: var(--badge-text); background: var(--badge-gut); }
.badge.warn { background: var(--badge-warn); }
.badge.schlecht { background: var(--badge-schlecht); }
.badge.neutral { background: var(--karte-2); color: var(--text-2); font-weight: 600; }

.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 0.8125rem; font-weight: 600; white-space: nowrap; }
.delta.gut { color: var(--gut); }
.delta.schlecht { color: var(--schlecht); }
.delta.neutral { color: var(--text-2); }

/* Ring mit Farbverlauf */
.ring-box { position: relative; display: grid; place-items: center; flex: none; }
.ring-box svg { transform: rotate(-90deg); }
.ring-zahl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.875rem; font-weight: 700; }
.ring-zahl small { font-size: 0.625rem; font-weight: 600; color: var(--text-2); margin-left: 1px; }

/* ---------- Karten ---------- */
.karte { background: var(--karte); border-radius: var(--r-karte); padding: var(--s-4); }
.karte-kopf { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); margin-bottom: var(--s-3); }
.karte-titel { margin: 0; font-size: 0.875rem; font-weight: 500; color: var(--text-2); }
.karte-summe { font-size: 0.9375rem; font-weight: 700; white-space: nowrap; }
.karte .notiz { margin: var(--s-3) 0 0; font-size: 0.8125rem; color: var(--text-2); }

/* Drei Spalten mit Haarlinien */
.spalten { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.spalten.vier { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.spalte { display: flex; flex-direction: column; gap: 3px; padding: 0 var(--s-3); min-width: 0; }
.spalte:first-child { padding-left: 0; }
.spalte:last-child { padding-right: 0; }
.spalte + .spalte { border-left: 1px solid var(--trenner); }
.spalte .wert { font-size: 1.3125rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; line-height: 1.15; }
.spalte .wert small { font-size: 0.8125rem; font-weight: 500; margin-left: 3px; letter-spacing: 0; }
.spalte .lbl { font-size: 0.75rem; color: var(--text-2); line-height: 1.25; }
.spalte .delta { min-height: 1.1em; }

/* Abschnittstitel wie "Weekly trips" */
.abschnitt-kopf { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.abschnitt-kopf h2, h2.abschnitt-titel { margin: 0; font-size: 1.1875rem; font-weight: 700; letter-spacing: -0.01em; }
.abschnitt-unter { margin: -6px 0 0; font-size: 0.875rem; color: var(--text-2); }
.tageskopf { display: flex; justify-content: space-between; align-items: baseline; margin: var(--s-2) 2px 0; color: var(--text-2); font-size: 0.875rem; }
.tageskopf b { font-weight: 600; color: var(--text-2); }

/* ---------- Knöpfe ---------- */
.btn {
  appearance: none; border: 0; border-radius: var(--r-knopf);
  min-height: 50px; padding: 0 var(--s-5);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  font-size: 1.0625rem; font-weight: 600; text-decoration: none;
  transition: transform 0.12s ease, opacity 0.15s ease, background-color 0.15s ease;
}
.btn:active { transform: scale(0.98); opacity: 0.85; }
.btn-primaer { background: var(--akzent-flaeche); color: var(--auf-akzent); }
.btn-sekundaer { background: var(--karte-2); color: var(--text); }
.btn-gefahr { background: var(--karte-2); color: var(--schlecht); }
.btn-breit { width: 100%; }
.btn-klein { min-height: var(--ziel); padding: 0 var(--s-4); font-size: 0.9375rem; border-radius: 12px; }
.btn-text { appearance: none; border: 0; background: none; color: var(--akzent); font-size: 0.9375rem; font-weight: 600; min-height: var(--ziel); padding: 0 var(--s-1); display: inline-flex; align-items: center; gap: 4px; }
.btn-text svg { width: 18px; height: 18px; }
.icon-btn {
  appearance: none; border: 0; flex: none;
  width: var(--ziel); height: var(--ziel); border-radius: 50%;
  display: inline-grid; place-items: center; background: var(--karte-2); color: var(--text);
}
.icon-btn svg { width: 20px; height: 20px; }
.knopf-reihe { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.knopf-reihe .btn { flex: 1 1 9rem; }

/* ---------- Listen (iOS gruppiert) ---------- */
.liste { background: var(--karte); border-radius: var(--r-karte); overflow: hidden; }
.zeile {
  display: flex; align-items: center; gap: var(--s-3);
  min-height: 52px; padding: 10px var(--s-4); position: relative;
  width: 100%; text-align: left; color: inherit; background: none; border: 0; font-size: 1rem;
}
.zeile + .zeile::before { content: ""; position: absolute; top: 0; right: 0; left: var(--s-4); height: 1px; background: var(--trenner); }
.liste .zeile.mit-icon + .zeile::before, .liste .zeile + .zeile.mit-icon::before { left: calc(var(--s-4) + 30px + var(--s-3)); }

.z-icon { width: 30px; height: 30px; border-radius: 8px; flex: none; display: grid; place-items: center; color: var(--auf-icon); background: var(--i-grau); }

.z-icon.rot { background: var(--i-rot); } .z-icon.lila { background: var(--i-lila); } .z-icon.tuerkis { background: var(--i-tuerkis); }
.z-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }

/* Schalter im iOS-Stil */
.schalter { position: relative; width: 51px; height: 31px; flex: none; }
.schalter input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.schalter span { position: absolute; inset: 0; border-radius: 999px; background: var(--karte-3); transition: background-color 0.2s ease; }
.schalter span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3); transition: transform 0.22s var(--kurve); }
.schalter input:checked + span { background: var(--schalter-an); }

.stepper { display: inline-flex; align-items: center; gap: var(--s-2); flex: none; }

.feld-inline { width: 6.5rem; min-height: var(--ziel); text-align: right; border: 0; border-radius: var(--r-feld); background: var(--karte-2); padding: 0 12px; font-size: 1rem; font-weight: 600; }

/* ---------- Rechnen ---------- */
.hero-kopf { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); }
.hero-betrag { margin: var(--s-2) 0 2px; }

.walzen { display: flex; flex-wrap: nowrap; align-items: center; font-size: 3.25rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }

.walzen .einheit { font-size: 0.5em; font-weight: 600; color: var(--text-2); margin-left: 0.2em; letter-spacing: 0; align-self: flex-end; padding-bottom: 0.45em; }

.strecke-zeile { display: flex; align-items: center; gap: var(--s-3); padding: 12px var(--s-4); }

.schnell { display: flex; gap: var(--s-2); overflow-x: auto; padding: 2px 0 4px; margin: 0 calc(-1 * var(--gutter-r)) 0 0; scrollbar-width: none; scroll-snap-type: x proximity; }

}

.mini-saeulen { display: grid; grid-template-columns: repeat(7, 7px); gap: 5px; align-items: end; height: 40px; flex: none; }

.aktion-leiste { position: sticky; bottom: calc(var(--tab-h) + var(--tab-abstand) + 12px); z-index: 20; }

/* ---------- Kategorien ---------- */

  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4.5 12.5l5 5L19.5 7' fill='none' stroke='black' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / contain no-repeat;
  mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4.5 12.5l5 5L19.5 7' fill='none' stroke='black' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / contain no-repeat; }
.filter { display: flex; gap: var(--s-2); overflow-x: auto; scrollbar-width: none; padding: 2px 0; margin-right: calc(-1 * var(--gutter-r)); }

/* ---------- Säulendiagramm wie im Referenzbild ---------- */
.saeulen-diagramm { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s-2); }
.sd-spalten { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }

.anteil-balken { display: flex; height: 4px; border-radius: 2px; overflow: hidden; gap: 0; margin: var(--s-4) 0 var(--s-3); background: var(--karte-2); }

.legende { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-3) var(--s-2); }

/* ---------- Fahrten-Karten wie im Referenzbild ---------- */
.fahrten-liste { display: flex; flex-direction: column; gap: var(--s-2); }
.fahrt {
  appearance: none; border: 0; width: 100%; text-align: left; color: inherit;
  background: var(--karte); border-radius: 16px; padding: 14px 12px 14px 14px;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px var(--s-3); align-items: center;
}

.fahrt .f-icon { grid-row: 1 / span 3; align-self: center; color: var(--k); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: color-mix(in srgb, var(--k) 16%, transparent); }
.fahrt .f-icon svg { width: 20px; height: 20px; }

/* ---------- Schwebender Zeitraum-Navigator ---------- */
.zeitnavi {
  position: fixed; z-index: 39; left: 0; right: 0; margin: 0 auto;
  bottom: calc(var(--tab-h) + var(--tab-abstand) + 10px);
  width: calc(100% - 2 * max(12px, env(safe-area-inset-left, 0px))); max-width: calc(30rem - 8px);
  height: var(--navi-h); padding: 0 7px; border-radius: var(--r-pill);
  display: flex; align-items: center; gap: var(--s-2);
  background: var(--glas); border: 1px solid var(--glas-rand);

  box-shadow: 0 12px 30px -12px var(--schatten);
}

.zeitnavi .heute-btn { appearance: none; border: 0; background: none; color: var(--text-2); width: var(--ziel); height: var(--ziel); display: grid; place-items: center; border-radius: 50%; flex: none; }

/* ---------- Segment-Steuerung ---------- */
.segment { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--karte-2); border-radius: 11px; padding: 3px; gap: 2px; }
.segment button { appearance: none; border: 0; background: none; border-radius: 9px; min-height: var(--ziel); font-size: 0.875rem; font-weight: 600; color: var(--text-2); }

/* ---------- Bilanz ---------- */
.bilanz-betrag { font-size: 2.75rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; margin: var(--s-2) 0 var(--s-1); }

.vergleich-zeile { margin: 0 0 var(--s-4); font-size: 0.875rem; color: var(--text-2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.budget-inhalt .b-gross { font-size: 1.1875rem; font-weight: 700; }
.diagramm { width: 100%; height: auto; overflow: visible; }

.diagramm .budget-linie { stroke: var(--warn); stroke-width: 1.75; stroke-dasharray: 6 4; }
.diagramm .punkt { fill: var(--akzent); stroke: var(--karte); stroke-width: 2.5; }
.diagramm .wert-text { fill: var(--text); font-weight: 700; font-size: 12px; }
.diagramm .preis-linie { fill: none; stroke: var(--k-studium); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.diagramm .preis-punkt { fill: var(--k-studium); stroke: var(--karte); stroke-width: 2.5; }
.diagramm .heat-0 { fill: var(--heat-0); } .diagramm .heat-1 { fill: var(--heat-1); } .diagramm .heat-2 { fill: var(--heat-2); }
.diagramm .heat-3 { fill: var(--heat-3); } .diagramm .heat-4 { fill: var(--heat-4); }
.diagramm .heute { stroke: var(--text); stroke-width: 1.5; fill: none; }
.mini-legende { display: flex; gap: var(--s-4); flex-wrap: wrap; font-size: 0.75rem; color: var(--text-2); margin-top: var(--s-2); }
.mini-legende i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; background: var(--akzent); }
.mini-legende i.vor { background: repeating-linear-gradient(90deg, var(--text-3) 0 4px, transparent 4px 7px); }
.mini-legende i.budget { background: repeating-linear-gradient(90deg, var(--warn) 0 6px, transparent 6px 9px); }
.heat-skala { display: flex; gap: 4px; align-items: center; font-size: 0.6875rem; color: var(--text-2); margin-top: var(--s-2); }
.heat-skala i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.erkenntnisse { display: flex; flex-direction: column; gap: var(--s-2); }
.erkenntnis { display: grid; grid-template-columns: auto 1fr; gap: var(--s-3); align-items: start; background: var(--karte); border-radius: 16px; padding: 14px; }
.erkenntnis .e-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--auf-icon); background: var(--i-blau); }
.erkenntnis .e-icon svg { width: 18px; height: 18px; }
.erkenntnis .e-zahl { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
.erkenntnis .e-zahl small { font-size: 0.8125rem; font-weight: 500; color: var(--text-2); margin-left: 4px; letter-spacing: 0; }
.erkenntnis p { margin: 2px 0 0; font-size: 0.875rem; color: var(--text-2); line-height: 1.4; }
.erkenntnis p small { display: block; margin-top: 4px; font-size: 0.75rem; }

/* ---------- Route ---------- */
.such-karte { padding: 4px 0; position: relative; z-index: 5; }
.suchfeld { position: relative; display: flex; align-items: center; gap: var(--s-3); padding: 6px 8px 6px var(--s-4); }
.suchfeld + .suchfeld::before { content: ""; position: absolute; top: 0; right: 0; left: calc(var(--s-4) + 12px + var(--s-3)); height: 1px; background: var(--trenner); }
.suchfeld input { flex: 1; min-width: 0; min-height: var(--ziel); border: 0; background: none; padding: 0; font-size: 1rem; }
.suchfeld input::placeholder { color: var(--text-3); }
.suchfeld input:focus-visible { outline: none; }
.suchfeld:focus-within { box-shadow: inset 3px 0 0 var(--akzent); }
.pkt { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--pin-start); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pin-start) 30%, transparent); }
.pkt.ziel { background: var(--pin-ziel); border-radius: 50% 50% 50% 2px; transform: rotate(-45deg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pin-ziel) 30%, transparent); }
.vorschlaege { position: absolute; left: 8px; right: 8px; top: calc(100% + 2px); z-index: 30; background: var(--karte-2); border-radius: 14px; box-shadow: 0 18px 40px -14px var(--schatten); list-style: none; margin: 0; padding: 4px; max-height: 18rem; overflow: auto; }
.vorschlaege button { appearance: none; border: 0; background: none; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; display: block; min-height: var(--ziel); }
.vorschlaege button:hover, .vorschlaege button:focus-visible { background: var(--karte-3); }
.vorschlaege b { display: block; font-weight: 600; font-size: 0.9375rem; }
.vorschlaege small { color: var(--text-2); font-size: 0.8125rem; }
.vorschlaege .info { padding: 12px; color: var(--text-2); font-size: 0.875rem; }
.orte-chips { display: flex; gap: var(--s-2); overflow-x: auto; scrollbar-width: none; margin-right: calc(-1 * var(--gutter-r)); }
.orte-chips::-webkit-scrollbar { display: none; }
.orte-chips button { appearance: none; border: 0; flex: none; min-height: var(--ziel); padding: 0 14px; border-radius: var(--r-pill); background: var(--karte); color: var(--text); font-size: 0.875rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; position: relative; }

/* Fehler direkt am Feld anzeigen statt nur als kurze Einblendung */
function feldFehler(input, text) {
  if (!input) return;
  const id = input.id + '-fehler';
  const alt = document.getElementById(id);
  const zeile = input.closest('.strecke-zeile');
  if (alt) alt.remove();
  if (!text) {
    input.removeAttribute('aria-invalid');
    input.removeAttribute('aria-describedby');
    if (zeile) zeile.removeAttribute('data-fehler');
    return;
  }
  const msg = document.createElement('span');
  msg.className = 'feld-fehler' + (zeile ? ' strecke-fehler' : '');
  msg.id = id;
  msg.setAttribute('role', 'alert');
  msg.innerHTML = ICON_HINWEIS + '<span></span>';
  msg.lastChild.textContent = text;
  if (zeile) { zeile.setAttribute('data-fehler', 'true'); zeile.insertAdjacentElement('afterend', msg); }
  else (input.closest('.feld') || input.parentElement).appendChild(msg);
  input.setAttribute('aria-invalid', 'true');
  input.setAttribute('aria-describedby', id);
  input.addEventListener('input', () => feldFehler(input, ''), { once: true });
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

   Rechnen
   ========================================================= */
function berechne({ km, veh, p, pers = 1, extra = 0 }, settings = S.settings) {
  const cons = veh?.cons || 0;
  const menge = (km * cons) / 100;
  const sprit = menge * p;
  const verschleiss = settings.verschleissAn ? (km * (settings.verschleissCt || 0)) / 100 : 0;
  const gesamt = sprit + verschleiss + (extra || 0);
  const co2 = menge * (KRAFTSTOFF[veh?.fuel]?.co2 || 0);
  return { menge, sprit, verschleiss, gesamt, proPerson: gesamt / Math.max(1, pers), proKm: km ? gesamt / km : 0, co2 };
}
function neueFahrt({ t, titel, kat, km, rt, veh, p, pers = 1, extra = 0, notiz = '', von = '', nach = '' }, settings) {
  const r = berechne({ km, veh, p, pers, extra }, settings);
  return {
    id: uid(), t, titel: titel || 'Fahrt', kat: kat || 'sonst', km: round(km, 1), rt: !!rt,
    veh: veh.id, vehName: veh.name, fuel: veh.fuel, cons: veh.cons, p: round(p, 3), pers: Math.max(1, pers | 0), extra: round(extra, 2),
    verschleiss: round(r.verschleiss, 2), sprit: round(r.sprit, 2), menge: round(r.menge, 2), gesamt: round(r.gesamt, 2),
    notiz, von, nach,
  };
}

function beispielZustand() {
  const s = grundzustand();
  s.demo = true;
  s.vehicles = [
    { id: 'v1', name: 'Golf VII', fuel: 'e10', cons: 6.4, tank: 50 },
    { id: 'v2', name: 'Polo der Familie', fuel: 'e10', cons: 5.6, tank: 40 },
  ];
  s.activeVehicle = 'v1';
  s.settings.budget = 180;
  s.settings.lohn = 13.5;
  s.prices.e10 = { p: 2.129, station: 'Beispiel-Tankstelle', t: Date.now() - 3 * 3600e3, src: 'beispiel' };
  s.routes = [
    { id: uid(), name: 'Arbeitsweg', km: 14.2, rt: true, kat: 'arbeit' },
    { id: uid(), name: 'FH Salzburg', km: 21.6, rt: true, kat: 'studium' },
    { id: uid(), name: 'Fitnessstudio', km: 5.8, rt: true, kat: 'sport' },
    { id: uid(), name: 'Tennisplatz', km: 8.9, rt: true, kat: 'sport' },
    { id: uid(), name: 'Supermarkt', km: 3.4, rt: true, kat: 'einkauf' },
  ];
  const rnd = mulberry32(20261020);
  const heute = startOfDay(new Date());
  const jetztStunde = new Date().getHours();
  const trips = [];
  const fills = [];
  let odo = 84210;
  let seitTanken = 0;
  fills.push({ id: uid(), t: +addDays(heute, -86).setHours(18, 20), veh: 'v1', l: 41.3, eur: 86.32, odo, voll: true, station: 'Beispiel-Tankstelle' });
  for (let zurueck = 84; zurueck >= 0; zurueck--) {
    const d = addDays(heute, -zurueck);
    const wt = (d.getDay() + 6) % 7;
    const woche = Math.floor(zurueck / 7);
    const preis = 2.115 + 0.11 * Math.sin((84 - zurueck) / 12) + (rnd() - 0.5) * 0.04;
    const plan = [];
    if (wt === 0 || wt === 2) plan.push(['FH Salzburg', 21.6, 'studium', 8]);
    if (wt === 1 || wt === 3 || wt === 4) plan.push(['Arbeitsweg', 14.2, 'arbeit', 16]);
    if (wt === 5 && woche % 2 === 0) plan.push(['Arbeitsweg', 14.2, 'arbeit', 11]);
    if (wt === 0 || wt === 2 || wt === 4) plan.push(['Fitnessstudio', 5.8, 'sport', 18]);
    if (wt === 3) plan.push(['Tennisplatz', 8.9, 'sport', 19]);
    if ((wt === 1 && rnd() < 0.7) || (wt === 5 && rnd() < 0.5)) plan.push(['Supermarkt', 3.4, 'einkauf', 17]);
    if (wt === 6 && woche % 2 === 1) plan.push(['Bergtour', 34.5, 'freizeit', 8]);
    if (wt === 6 && rnd() < 0.35) plan.push(['Freunde besuchen', 18, 'freizeit', 15]);
    if (rnd() < 0.04) plan.push(['Werkstatt', 11.2, 'sonst', 10]);
    for (const [name, einfach, kat, stunde] of plan) {
      if (zurueck > 0 && rnd() < 0.12) continue;
      if (zurueck === 0 && stunde > jetztStunde) continue;
      const km = round(einfach * 2, 1);
      const t = new Date(d); t.setHours(stunde, Math.floor(rnd() * 50), 0, 0);
      const veh = kat === 'freizeit' && rnd() < 0.3 ? s.vehicles[1] : s.vehicles[0];
      const pers = name === 'Bergtour' ? 3 : name === 'Freunde besuchen' ? 2 : 1;
      trips.push(neueFahrt({ t: +t, titel: name, kat, km, rt: true, veh, p: round(preis, 3), pers, extra: name === 'Bergtour' ? 6 : 0 }, s.settings));
      if (veh.id === 'v1') { odo += km; seitTanken += km; }
    }
    if (seitTanken > 560) {
      const l = round((seitTanken * 6.85) / 100, 2);
      const t = new Date(d); t.setHours(19, 10, 0, 0);
      fills.push({ id: uid(), t: +t, veh: 'v1', l, eur: round(l * (preis - 0.03), 2), odo: Math.round(odo), voll: true, station: 'Beispiel-Tankstelle' });
      seitTanken = 0;
    }
  }
  s.trips = trips;
  s.fills = fills;
  s.calc = { km: 14.2, rt: true, pers: 1, extra: 0, titel: 'Arbeitsweg', kat: 'arbeit', von: '', nach: '' };
  return s;
}

  const a = ROOT.getAttribute('data-theme');

   ========================================================= */
function walzen(el, { int, dec, hoch = false, gross = false, einheit = '' }) {
  el.className = 'walzen' + (gross ? ' gross' : '');
  el.innerHTML = '';
  const trommeln = [];
  const baue = (extra) => {
    const w = document.createElement('span');
    w.className = 'walze' + (extra ? ' ' + extra : '');
    w.setAttribute('aria-hidden', 'true');
    const b = document.createElement('span');
    b.className = 'band';
    b.innerHTML = '0123456789'.split('').map((z) => `<span>${z}</span>`).join('');
    w.appendChild(b);
    el.appendChild(w);
    trommeln.push({ w, b });
  };
  for (let i = 0; i < int; i++) baue();
  const k = document.createElement('span');
  k.className = 'komma'; k.textContent = ','; k.setAttribute('aria-hidden', 'true');
  el.appendChild(k);
  for (let i = 0; i < dec; i++) baue(hoch && i === dec - 1 ? 'hoch' : '');
  if (einheit) {
    const e = document.createElement('span');
    e.className = 'einheit'; e.textContent = einheit; e.setAttribute('aria-hidden', 'true');
    el.appendChild(e);
  }
  const sr = document.createElement('span');
  sr.className = 'sr';
  el.appendChild(sr);
  const max = 10 ** int - 10 ** -dec;
  return {
    set(v, label) {
      const wert = clamp(isFinite(v) ? v : 0, 0, max);
      const ziffern = wert.toFixed(dec).replace('.', '').padStart(int + dec, '0').split('');
      let fuehrend = true;
      ziffern.forEach((z, i) => {
        const t = trommeln[i];
        const d = +z;
        if (i < int - 1 && fuehrend && d === 0) t.w.classList.add('null');
        else { fuehrend = false; t.w.classList.remove('null'); }
        t.b.style.transitionDelay = WENIG_BEWEGUNG ? '0ms' : `${(int + dec - 1 - i) * 55}ms`;
        t.b.style.transform = `translateY(${-d * 1.16}em)`;
      });
      sr.textContent = label || '';
    },
  };
}

let ringNr = 0;
function ring(anteil, { groesse = 54, staerke = 5, text = '' } = {}) {
  const id = 'rg' + (++ringNr);
  const r = (groesse - staerke) / 2;
  const c = 2 * Math.PI * r;
  const voll = clamp(isFinite(anteil) ? anteil : 0, 0, 1);
  const ueber = anteil > 1;
  const m = groesse / 2;
  return `<span class="ring-box${groesse > 60 ? ' gross' : ''}" style="width:${groesse}px;height:${groesse}px" aria-hidden="true">
    <svg width="${groesse}" height="${groesse}" viewBox="0 0 ${groesse} ${groesse}">
      <defs><linearGradient id="${id}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" style="stop-color:var(--ring-1)"/><stop offset=".55" style="stop-color:var(--ring-2)"/><stop offset="1" style="stop-color:var(--ring-3)"/></linearGradient></defs>
      <circle cx="${m}" cy="${m}" r="${r}" fill="none" style="stroke:var(--karte-2)" stroke-width="${staerke}"/>
      <circle cx="${m}" cy="${m}" r="${r}" fill="none" style="stroke:${ueber ? 'var(--schlecht)' : `url(#${id})`}" stroke-width="${staerke}" stroke-linecap="round" stroke-dasharray="${(c * voll).toFixed(2)} ${c.toFixed(2)}"/>
    </svg><span class="ring-zahl">${text}</span></span>`;
}
const ringText = (anteil) => `${NF.int.format(Math.round((anteil || 0) * 100))}<small>%</small>`;
/* Pfeil wie im Referenzbild: grün = gut, rot = schlecht, grau = neutral */
function delta(diff, { format, mehrIstSchlecht = true, neutral = false } = {}) {
  if (diff === null || diff === undefined || !isFinite(diff)) return '<span class="delta neutral" aria-hidden="true">–</span>';
  if (Math.abs(diff) < 0.005) return '<span class="delta neutral">± 0</span>';
  const hoch = diff > 0;
  const cls = neutral ? 'neutral' : (hoch === mehrIstSchlecht ? 'schlecht' : 'gut');
  return `<span class="delta ${cls}"><span aria-hidden="true">${hoch ? '↑' : '↓'}</span>${format(Math.abs(diff))}<span class="sr"> ${hoch ? 'mehr' : 'weniger'} als davor</span></span>`;
}
function status(ausgegeben, budget, anteilZeit) {

function saeulenHtml(spalten, { interaktiv = false, gewaehlt = null, beschreibung = '' } = {}) {
  const max = Math.max(0, ...spalten.map((s) => s.summe));
  const schritt = schoenAufrunden(Math.max(max, 1) / 4);
  const oben = Math.max(schritt, Math.ceil(max / schritt - 1e-9) * schritt);
  const ticks = [];
  if (max > 0) for (let i = 1; schritt * i <= oben + 1e-9; i++) ticks.push(schritt * i);
  const fmt = (v) => (Math.abs(v - Math.round(v)) < 1e-9 ? NF.int.format(v) : NF.d1.format(v));
  const tag = interaktiv ? 'button' : 'div';
  const sp = spalten.map((s, i) => `<${tag} class="sd-spalte${s.aktiv ? ' heute' : ''}" ${interaktiv ? `type="button" data-action="tag" data-i="${i}" aria-pressed="${gewaehlt === i}"` : 'role="img"'} aria-label="${esc(s.aria)}">
      <span class="sd-feld"><span class="sd-saeule" style="height:${oben ? (s.summe / oben) * 100 : 0}%">${KAT.filter((k) => s.teile[k.id]).map((k) => `<i class="k-${k.id}" style="flex-grow:${s.teile[k.id].toFixed(3)}"></i>`).join('')}</span></span>
      <span class="sd-lbl">${esc(s.lbl)}</span></${tag}>`).join('');
  return `<div class="saeulen-diagramm">
    <div class="sd-spalten${gewaehlt !== null ? ' gefiltert' : ''}" style="--n:${spalten.length}" ${interaktiv ? `role="group" aria-label="${esc(beschreibung || 'Tage, antippen zum Filtern')}"` : `role="group" aria-label="${esc(beschreibung)}"`}>${sp}</div>
    <div class="sd-achse" aria-hidden="true">${ticks.map((v) => `<span style="bottom:${(v / oben) * 100}%">${fmt(v)}</span>`).join('')}</div>
  </div>`;
}

function ladeLeaflet() {
  return new Promise((res, rej) => {

    s.async = true;
    const timer = setTimeout(() => rej(new Error('Zeitüberschreitung')), 10000);
    s.onload = () => { clearTimeout(timer); window.L ? res(window.L) : rej(new Error('Leaflet fehlt')); };
    s.onerror = () => { clearTimeout(timer); rej(new Error('Laden fehlgeschlagen')); };
    document.head.appendChild(s);
  });
}
async function karteStarten() {

async function holeJson(url, ms = 9000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal, headers: { Accept: 'application/json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function photonText(pr) {
  const strasse = [pr.street, pr.housenumber].filter(Boolean).join(' ');
  const titel = pr.name || strasse || pr.city || 'Ort';
  const ort = [pr.postcode, pr.city || pr.county].filter(Boolean).join(' ');
  const sub = [pr.name && strasse ? strasse : '', ort, pr.country].filter(Boolean).join(', ');
  return { titel, sub };
}
async function suchen(q) {
  const c = Karte.map ? Karte.map.getCenter() : null;
  try {
    const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&lang=de${c ? `&lat=${c.lat.toFixed(3)}&lon=${c.lng.toFixed(3)}` : ''}`;
    const r = await holeJson(url, 7000);
    return (r.features || []).map((f) => { const t = photonText(f.properties || {}); return { label: t.titel, sub: t.sub, lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0] }; });
  } catch (e) {
    const r = await holeJson(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=de&q=${encodeURIComponent(q)}`, 8000);
    return r.map((x) => ({ label: x.name || x.display_name.split(',')[0], sub: x.display_name.split(',').slice(1, 4).join(',').trim(), lat: +x.lat, lon: +x.lon }));
  }
}
async function rueckwaerts(lat, lon) {
  const r = await holeJson(`https://photon.komoot.io/reverse?lon=${lon}&lat=${lat}&lang=de`, 6000);
  const f = r.features && r.features[0];
  if (!f) return '';
  const t = photonText(f.properties || {});
  return t.titel + (t.sub ? ', ' + t.sub.split(',')[0] : '');
}
function sucheVerdrahten(feld) {
  const input = $(`#in-${feld}`);
  const box = input.closest('.suchfeld');
  let timer = 0;
  let liste = null;
  let ergebnisse = [];
  const schliessen = () => { if (liste) { liste.remove(); liste = null; } input.setAttribute('aria-expanded', 'false'); };
  const zeigen = (items, info, laedt) => {
    schliessen();
    liste = document.createElement('ul');
    liste.className = 'vorschlaege';
    liste.id = `vs-${feld}`;
    liste.setAttribute('role', 'listbox');
    liste.innerHTML = laedt
      ? `<li style="padding:10px">${lade('Suche läuft …')}</li>`
      : info
      ? `<li class="info" role="status">${esc(info)}</li>`
      : items.map((it, i) => `<li><button type="button" role="option" data-i="${i}"><b>${esc(it.label)}</b><small>${esc(it.sub || '')}</small></button></li>`).join('');
    box.appendChild(liste);
    input.setAttribute('aria-expanded', 'true');
    liste.addEventListener('click', (e) => {
      const b = e.target.closest('[data-i]'); if (!b) return;
      const it = ergebnisse[+b.dataset.i];
      input.value = it.label;
      schliessen();
      punktSetzen(feld, { lat: it.lat, lon: it.lon, label: it.label });
      input.blur();
    });
  };
  input.setAttribute('aria-autocomplete', 'list');
  input.setAttribute('aria-controls', `vs-${feld}`);
  input.addEventListener('input', () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 3) { schliessen(); return; }
    if (istOffline()) { zeigen([], 'Du bist offline. Die Adresssuche braucht Internet.'); return; }
    timer = setTimeout(async () => {
      zeigen([], '', true);
      try {
        ergebnisse = await suchen(q);
        if (input.value.trim() !== q) return;
        zeigen(ergebnisse, ergebnisse.length ? '' : 'Nichts gefunden. Versuch es mit Straße und Ort.');
      } catch (e) {
        zeigen([], IM_RAHMEN ? 'Die Adresssuche ist in dieser Vorschau gesperrt. In der installierten App funktioniert sie.' : 'Adresssuche nicht erreichbar. Prüfe deine Internetverbindung.');
      }
    }, 320);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') schliessen();
    if (e.key === 'Enter' && ergebnisse.length && liste) { e.preventDefault(); liste.querySelector('[data-i="0"]')?.click(); }
  });
  input.addEventListener('blur', () => setTimeout(schliessen, 220));
}
function punktSetzen(feld, p) {
  Karte[feld] = p;
  $(`#in-${feld}`).value = p.label;
  if (Karte.hinweis) { Karte.hinweis = null; routeStatus(); }
  markerSetzen(feld);
  if (Karte.von && Karte.nach) routeBerechnen();
  else {
    Karte.route = null;
    if (Karte.linie) { Karte.map.removeLayer(Karte.linie); Karte.map.removeLayer(Karte.linieRand); Karte.linie = null; }
    if (Karte.map) Karte.map.setView([p.lat, p.lon], Math.max(Karte.map.getZoom(), 13));
    routeErgebnis();
  }
}
function markerSetzen(feld) {
  if (!Karte.map) return;
  const p = Karte[feld];
  const key = feld === 'von' ? 'mA' : 'mB';
  if (Karte[key]) { Karte.map.removeLayer(Karte[key]); Karte[key] = null; }
  if (!p) return;
  const icon = Karte.L.divIcon({ className: '', html: `<span class="pin${feld === 'nach' ? ' ziel' : ''}" aria-hidden="true"></span>`, iconSize: [20, 20], iconAnchor: [10, 10] });
  Karte[key] = Karte.L.marker([p.lat, p.lon], { icon, keyboard: false }).addTo(Karte.map);
}
async function routeBerechnen() {
  const a = Karte.von, b = Karte.nach;
  Karte.laedt = true; Karte.fehler = ''; routeErgebnis();
  try {
    const r = await holeJson(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson&alternatives=false&steps=false`, 12000);
    if (r.code !== 'Ok' || !r.routes || !r.routes.length) throw new Error('keine Route');
    const rt = r.routes[0];
    Karte.route = { km: rt.distance / 1000, min: rt.duration / 60, coords: rt.geometry.coordinates.map(([x, y]) => [y, x]) };
    linieZeichnen();
  } catch (e) {
    Karte.route = null;
    Karte.fehler = istOffline() ? 'Du bist offline. Die Route lässt sich erst mit Internet berechnen.' : IM_RAHMEN ? 'Die Routenberechnung ist in dieser Vorschau gesperrt. In der installierten App funktioniert sie.' : 'Route konnte nicht berechnet werden. Prüfe die Verbindung oder wähle andere Punkte.';
  }
  Karte.laedt = false;
  routeErgebnis();
}
function linieZeichnen() {
  if (!Karte.map || !Karte.route) return;
  const L = Karte.L;
  if (Karte.linie) { Karte.map.removeLayer(Karte.linie); Karte.map.removeLayer(Karte.linieRand); }
  Karte.linieRand = L.polyline(Karte.route.coords, { color: token('--route-rand'), weight: 10, opacity: 0.9, lineJoin: 'round', lineCap: 'round' }).addTo(Karte.map);
  Karte.linie = L.polyline(Karte.route.coords, { color: token('--route-linie'), weight: 5.5, opacity: 1, lineJoin: 'round', lineCap: 'round' }).addTo(Karte.map);
  Karte.map.fitBounds(Karte.linie.getBounds(), { padding: [36, 36] });
  if (Karte.mA) Karte.mA.setZIndexOffset(1000);
  if (Karte.mB) Karte.mB.setZIndexOffset(1000);
}
function standortHolen() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('kein GPS'));
    navigator.geolocation.getCurrentPosition((p) => res({ lat: p.coords.latitude, lon: p.coords.longitude }), rej, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  });
}

const FZ = { woche: 0, kat: null, tag: null };

  const wb = wochenBudget();
  const zeitAnteil = laufend ? clamp((jetzt - +ab) / (7 * 864e5), 1 / 7, 1) : 1;

      $$('.kat-wahl [data-kat]', root).forEach((x) => x.setAttribute('aria-pressed', x === b));

    const lesen = () => {
      const vh = S.vehicles.find((x) => x.id === $('#e-veh', root).value) || veh;
      return { vh, km: clamp(num($('#e-km', root).value), 0, 9999), p: clamp(num($('#e-preis', root).value), 0, 99), pers: clamp(Math.round(num($('#e-pers', root).value)) || 1, 1, 9), extra: clamp(num($('#e-extra', root).value), 0, 9999) };

      if (neu) S.trips.push(n);
      else { n.id = fahrt.id; const i = S.trips.findIndex((y) => y.id === fahrt.id); S.trips[i] = n; }

      Sheet.close();
      neuZeichnen();
      toast(neu ? 'Fahrt gespeichert' : 'Änderungen gespeichert');

    const del = $('#e-loeschen', root);
    if (del) del.addEventListener('click', () => {
      $('#e-loeschen-box', root).innerHTML = `<div class="bestaetigen"><p>Diese Fahrt endgültig löschen?</p><button class="btn btn-sekundaer btn-klein" type="button" id="e-nein">Behalten</button><button class="btn btn-gefahr btn-klein" type="button" id="e-ja">Löschen</button></div>`;
      $('#e-nein', root).addEventListener('click', () => { Sheet.close(); });
      $('#e-ja', root).addEventListener('click', () => {

      });

  });
}

/* =========================================================
   Ansicht: Bilanz

const BZ = { modus: 'monat', versatz: 0 };
function zeitraum(modus, versatz) {
  const jetzt = new Date();
  if (modus === 'woche') {
    const ab = addDays(startOfWeek(jetzt), versatz * 7);
    return { ab, bis: addDays(ab, 7), name: `KW ${isoWeek(ab)}, ${DF.tagKurz.format(ab)} bis ${DF.tagKurz.format(addDays(ab, 6))}`, vorName: 'der Vorwoche',
      titel: versatz === 0 ? 'Diese Woche' : versatz === -1 ? 'Letzte Woche' : `KW ${isoWeek(ab)}`, sub: spanne(ab, addDays(ab, 6)) };
  }
  if (modus === 'monat') {
    const ab = addMonths(startOfMonth(jetzt), versatz);
    return { ab, bis: addMonths(ab, 1), name: DF.monat.format(ab), vorName: `im ${new Intl.DateTimeFormat('de-DE', { month: 'long' }).format(addMonths(ab, -1))}`,
      titel: versatz === 0 ? 'Dieser Monat' : DF.monat.format(ab), sub: spanne(ab, addDays(addMonths(ab, 1), -1)) };
  }
  if (modus === 'jahr') {
    const ab = new Date(jetzt.getFullYear() + versatz, 0, 1);
    return { ab, bis: new Date(ab.getFullYear() + 1, 0, 1), name: String(ab.getFullYear()), vorName: `${ab.getFullYear() - 1}`,
      titel: versatz === 0 ? 'Dieses Jahr' : String(ab.getFullYear()), sub: spanne(ab, new Date(ab.getFullYear(), 11, 31)) };
  }
  const erste = S.trips.length ? Math.min(...S.trips.map((f) => f.t)) : Date.now();
  return { ab: startOfDay(erste), bis: addDays(startOfDay(jetzt), 1), name: 'Alle Fahrten', vorName: '', titel: 'Alle Fahrten', sub: `seit ${DF.monat.format(new Date(erste))}` };
}
function budgetFuer(modus) {
  const b = S.settings.budget || 0;
  return modus === 'woche' ? (b * 12) / 52 : modus === 'monat' ? b : modus === 'jahr' ? b * 12 : 0;
}
const MODUS_NAME = { woche: 'Wochen', monat: 'Monats', jahr: 'Jahres' };
function renderBilanz() {
  const v = $('#v-bilanz');
  const z = zeitraum(BZ.modus, BZ.versatz);
  const liste = inZeit(z.ab, z.bis);
  const s = summen(liste);
  const vz = vorZeitraum(z, BZ.modus);
  const jetzt = Date.now();
  const laufend = jetzt >= +z.ab && jetzt < +z.bis;
  let vs = null;
  let bisText = '';
  if (vz) {
    let vBis = vz.bis;
    if (laufend) {
      // gleicher Abschnitt: z. B. 1. bis 20. September statt ganzer September
      vBis = BZ.modus === 'monat'
        ? new Date(Math.min(+vz.bis, +addDays(vz.ab, new Date().getDate() - 1) + (jetzt - +startOfDay(jetzt))))
        : new Date(+vz.ab + (jetzt - +z.ab));
      bisText = BZ.modus === 'monat' ? ` bis zum ${new Date().getDate()}.` : BZ.modus === 'woche' ? ' bis zum gleichen Tag' : ' bis heute';
    }
    vs = summen(inZeit(vz.ab, vBis));
  }
  let vergleich = '';
  if (vs && vs.eur > 0) {
    const d = (s.eur - vs.eur) / vs.eur;
    vergleich = Math.abs(d) < 0.03
      ? `<span class="delta neutral">≈</span><span>etwa so viel wie ${esc(z.vorName)}${bisText} (${esc(eur(vs.eur))})</span>`
      : `${delta(d, { format: (x) => NF.pct.format(x) })}<span>${d >= 0 ? 'mehr' : 'weniger'} als ${esc(z.vorName)}${bisText} (${esc(eur(vs.eur))})</span>`;
  } else if (vs) vergleich = '<span>Im Zeitraum davor keine Fahrten.</span>';
  const bud = budgetFuer(BZ.modus);
  const zeitAnteil = laufend ? clamp((jetzt - +z.ab) / (+z.bis - +z.ab), 0, 1) : 1;
  const st = bud ? status(s.eur, bud, zeitAnteil) : null;
  const sortiert = KAT.filter((k) => s.kat[k.id]).sort((a, b) => s.kat[b.id] - s.kat[a.id]);
  v.innerHTML = `
  <header class="kopf">
    <div class="kopf-text"><h1>Bilanz</h1><p class="unter">${bud ? `${MODUS_NAME[BZ.modus]}budget` : esc(z.sub)}${st ? ` <span class="badge ${st.cls}">${st.text}</span>` : ''}${demoBadge()}</p></div>
    <div class="kopf-rechts">${bud ? `${ring(s.eur / bud, { text: ringText(s.eur / bud) })}<span class="sr">${NF.pct.format(s.eur / bud)} vom Budget verbraucht</span>` : ''}</div>
  </header>
  <div class="segment" role="group" aria-label="Zeitraum">
    ${[['woche', 'Woche'], ['monat', 'Monat'], ['jahr', 'Jahr'], ['alles', 'Gesamt']].map(([id, n]) => `<button type="button" data-action="bilanz-modus" data-m="${id}" aria-pressed="${BZ.modus === id}">${n}</button>`).join('')}
  </div>
  <section class="karte" aria-labelledby="h-summe">
    <div class="karte-kopf" style="margin:0"><h2 class="karte-titel" id="h-summe">Ausgegeben</h2><span class="karte-summe leise">${esc(z.titel)}</span></div>
    <div class="bilanz-betrag">${esc(NF.d2.format(s.eur))}<small>€</small></div>
    ${vergleich ? `<p class="vergleich-zeile">${vergleich}</p>` : '<p class="vergleich-zeile"></p>'}
    <div class="spalten vier">
      <div class="spalte"><span class="wert">${kmAuto(s.km)}</span><span class="lbl">Kilometer</span></div>
      <div class="spalte"><span class="wert">${NF.d1.format(s.menge)}</span><span class="lbl">Liter</span></div>
      <div class="spalte"><span class="wert">${s.n}</span><span class="lbl">Fahrten</span></div>
      <div class="spalte"><span class="wert">${s.km ? NF.d1.format((s.eur / s.km) * 100) : '–'}</span><span class="lbl">Cent je km</span></div>
    </div>
  </section>
  ${budgetKarte(z, s)}
  ${s.n ? `
  <section class="karte" aria-labelledby="h-wofuer">
    <div class="karte-kopf"><h2 class="karte-titel" id="h-wofuer">Wofür</h2><span class="karte-summe">${esc(eur(s.eur))}</span></div>
    ${anteilHtml(s.kat, true)}
    <ul class="legende-zeilen">${sortiert.map((k) => `<li class="k-${k.id}"><span class="kat-punkt"></span><span class="lz-name">${esc(k.name)}</span><span class="lz-eur">${esc(eurKurz(s.kat[k.id]))}</span><span class="lz-pct">${NF.pct.format(s.kat[k.id] / s.eur)}</span></li>`).join('')}</ul>
    <p class="notiz">${wofuerSatz(s)}</p>
  </section>` : `<div class="karte leer">${ICON.balken}<h3>Keine Fahrten in diesem Zeitraum</h3><p>Sobald du Fahrten speicherst, siehst du hier, wofür dein Spritgeld draufgeht.</p><button class="btn btn-primaer btn-klein" type="button" data-action="tab" data-tab="rechnen">Zum Zählwerk</button></div>`}
  ${verlaufKarte(z)}
  ${BZ.modus === 'monat' ? `<section class="karte" aria-labelledby="h-kurve"><div class="karte-kopf"><h2 class="karte-titel" id="h-kurve">Monatskurve</h2><span class="karte-summe">${esc(eur(s.eur))}</span></div>${kurveDiagramm(z)}
    <div class="mini-legende"><span><i></i>${esc(new Intl.DateTimeFormat('de-DE', { month: 'long' }).format(z.ab))}</span><span><i class="vor"></i>Vormonat</span>${S.settings.budget ? '<span><i class="budget"></i>Budget</span>' : ''}</div></section>` : ''}
  <section class="karte" aria-labelledby="h-wann">
    <div class="karte-kopf"><h2 class="karte-titel" id="h-wann">Wann du fährst</h2><span class="karte-summe">16 Wochen</span></div>
    ${heatmap()}
  </section>
  ${preisDiagrammBox()}
  <section class="abschnitt" aria-labelledby="h-erk"><h2 class="abschnitt-titel" id="h-erk">Erkenntnisse</h2><div class="erkenntnisse">${erkenntnisse(z, s, liste)}</div></section>
  <p class="hinweis">Bei Fahrten mit Mitfahrern zählt nur dein Anteil. Kosten werden beim Speichern mit dem damaligen Spritpreis festgehalten, spätere Preisänderungen verändern alte Fahrten nicht.</p>
  ${BZ.modus !== 'alles' ? zeitnavi({ titel: z.titel, sub: z.sub, zurueck: 'bilanz-versatz', vor: 'bilanz-versatz', vorAus: BZ.versatz >= 0, heute: BZ.versatz < -1 ? 'bilanz-heute' : '' }) : ''}`;
  naviPlatz();
}
function budgetKarte(z, s) {
  const b = budgetFuer(BZ.modus);
  if (!b) return '';
  const jetzt = Date.now();
  const laufend = jetzt >= +z.ab && jetzt < +z.bis;
  const anteilZeit = laufend ? clamp((jetzt - +z.ab) / (+z.bis - +z.ab), 0, 1) : 1;
  const prognose = laufend && anteilZeit > 0.08 ? s.eur / anteilZeit : s.eur;
  const st = status(s.eur, b, anteilZeit);
  const rest = b - s.eur;
  const ueber = prognose > b;
  return `<section class="karte" aria-labelledby="h-budget">
    <div class="karte-kopf"><h2 class="karte-titel" id="h-budget">${MODUS_NAME[BZ.modus]}budget</h2><span class="badge ${st.cls}">${st.text}</span></div>
    <div class="b-zeile"><span class="b-gross">${esc(eur(s.eur))}</span><span class="leise">von ${esc(eur(b))}</span></div>
    <div class="b-balken${s.eur > b ? ' ueber' : ''}" role="img" aria-label="${esc(`${eur(s.eur)} von ${eur(b)} verbraucht${laufend ? `, Hochrechnung ${eur(prognose)}` : ''}`)}">
      <i style="width:${Math.min(100, (s.eur / Math.max(b, prognose, s.eur)) * 100).toFixed(1)}%"></i>
      ${laufend ? `<b class="b-marke" style="left:${Math.min(100, (prognose / Math.max(b, prognose, s.eur)) * 100).toFixed(1)}%"></b>` : ''}
      ${prognose > b || s.eur > b ? `<b class="b-grenze" style="left:${((b / Math.max(b, prognose, s.eur)) * 100).toFixed(1)}%"></b>` : ''}
    </div>
    <div class="spalten">
      <div class="spalte"><span class="wert">${esc(NF.int.format(Math.abs(rest)))}<small>€</small></span><span class="lbl">${rest >= 0 ? 'noch übrig' : 'über Budget'}</span></div>
      <div class="spalte"><span class="wert" style="color:${laufend ? (ueber ? 'var(--schlecht)' : 'var(--gut)') : 'inherit'}">${esc(NF.int.format(prognose))}<small>€</small></span><span class="lbl">${laufend ? 'Hochrechnung' : 'Endstand'}</span></div>
      <div class="spalte"><span class="wert">${NF.int.format(Math.round((s.eur / b) * 100))}<small>%</small></span><span class="lbl">verbraucht</span></div>
    </div>
    ${BZ.modus !== 'monat' ? `<p class="notiz">Anteilig aus deinem Monatsbudget von ${esc(eur(S.settings.budget))}.</p>` : ''}
  </section>`;
}
function verlaufKarte(z) {
  const monatlich = BZ.modus === 'jahr' || BZ.modus === 'alles';
  const spalten = [];
  if (monatlich) {
    let start = BZ.modus === 'jahr' ? new Date(z.ab) : startOfMonth(z.ab);
    const anzahl = BZ.modus === 'jahr' ? 12 : Math.min(12, Math.max(1, (new Date().getFullYear() - start.getFullYear()) * 12 + new Date().getMonth() - start.getMonth() + 1));
    if (BZ.modus === 'alles') start = addMonths(startOfMonth(new Date()), -(anzahl - 1));
    for (let i = 0; i < anzahl; i++) {
      const ab = addMonths(start, i);
      const s = summen(inZeit(ab, addMonths(ab, 1)));
      const lbl = DF.monatKurz.format(ab).replace('.', '');

function erkenntnisse(z, s, liste) {

  else if (s.eur && lohn) add('uhr', 'blau', NF.d1.format(s.eur / lohn), 'Stunden', 'So lange arbeitest du für alle Fahrten in diesem Zeitraum.', `Bei ${eur(lohn)} netto pro Stunde.`);

  }

  if (liter30 > 0) add('trend', 'orange', `+${esc(eur(liter30 * 0.1))}`, 'pro Monat', 'So viel mehr zahlst du, wenn der Liter 10 Cent teurer wird. Grundlage sind deine letzten 30 Tage.');
  const jahr = new Date().getFullYear();
  const arbeitstage = {};
  S.trips.filter((f) => f.kat === 'arbeit' && new Date(f.t).getFullYear() === jahr).forEach((f) => {
    const k = +startOfDay(f.t);
    const einfach = f.rt ? f.km / 2 : f.km;
    arbeitstage[k] = Math.max(arbeitstage[k] || 0, Math.floor(einfach));
  });
  const tageZahl = Object.keys(arbeitstage).length;
  if (tageZahl) {
    const summeKm = Object.values(arbeitstage).reduce((a, b) => a + b, 0);
    const satz = S.settings.pauschale || 0.38;
    add('steuer', 'lila', esc(eurKurz(summeKm * satz)), `bisher ${jahr}`, `Pendlerpauschale als Schätzung: ${tageZahl} Arbeitstage mit zusammen ${NF.int.format(summeKm)} vollen Entfernungs-km, je ${NF.d2.format(satz)} €.`, 'Seit 2026 gelten in Deutschland 0,38 € je vollem km der einfachen Strecke ab dem ersten Kilometer. Werbungskosten, keine Erstattung. Keine Steuerberatung.');
  }
  const veh = aktivesAuto();
  const ev = echterVerbrauch(veh.id);
  if (ev) {
    const diff = (ev.verbrauch - veh.cons) / veh.cons;
    add('tropfen', 'tuerkis', `${NF.d1.format(ev.verbrauch)}`, `${KRAFTSTOFF[veh.fuel].einheit}/100 km`, `Echter Verbrauch laut Tankbuch für ${esc(veh.name)}. Eingestellt sind ${NF.d1.format(veh.cons)}${Math.abs(diff) >= 0.03 ? `, deine Fahrten sind also um etwa ${NF.pct.format(Math.abs(diff))} zu ${diff > 0 ? 'günstig' : 'teuer'} berechnet` : ', das passt gut'}.`, Math.abs(diff) >= 0.03 ? 'Tipp: Verbrauch in der Garage anpassen.' : '');
  }

  const teuerste = liste.slice().sort((a, b) => anteil(b) - anteil(a))[0];
  if (teuerste && liste.length > 2) add('blitz', 'orange', esc(eur(anteil(teuerste))), 'teuerste Fahrt', `${esc(teuerste.titel)} am ${DF.tagKurz.format(new Date(teuerste.t))}, ${km1(teuerste.km)} km.`);

  if (neunzig.length > 5) {
    const ersteT = Math.min(...neunzig.map((f) => f.t));
    const tage = Math.max(14, (Date.now() - ersteT) / 864e5);
    add('kalender', 'blau', esc(eurKurz((neunzig.reduce((a, f) => a + anteil(f), 0) / tage) * 365)), 'pro Jahr', 'Hochrechnung, wenn du so weiterfährst wie in den letzten Wochen.');

  if (!out.length) return '<p class="hinweis">Mit ein paar gespeicherten Fahrten erscheinen hier Auswertungen, etwa wie viele Arbeitsstunden dein Arbeitsweg kostet.</p>';
  return out.join('');
}

function vorZeitraum(z, modus) {
  if (modus === 'woche') return { ab: addDays(z.ab, -7), bis: z.ab };
  if (modus === 'monat') return { ab: addMonths(z.ab, -1), bis: z.ab };
  if (modus === 'jahr') return { ab: new Date(z.ab.getFullYear() - 1, 0, 1), bis: z.ab };
  return null;
}
const inZeit = (ab, bis) => S.trips.filter((f) => f.t >= +ab && f.t < +bis);
function summen(liste) {
  const s = { eur: 0, km: 0, menge: 0, n: liste.length, kat: {}, co2: 0, gespart: 0 };
  liste.forEach((f) => {
    const a = anteil(f);
    s.eur += a; s.km += f.km; s.menge += f.menge || 0;
    s.kat[f.kat] = (s.kat[f.kat] || 0) + a;
    s.co2 += (f.menge || 0) * (KRAFTSTOFF[f.fuel]?.co2 || 0) / Math.max(1, f.pers || 1);
    s.gespart += f.gesamt - a;
  });
  return s;
}
function wofuerSatz(s) {

  if (!top) return '';
  const satz = { arbeit: 'Der Arbeitsweg', studium: 'Der Weg zum Studium', sport: 'Sport und Gym', freizeit: 'Freizeitfahrten', einkauf: 'Einkauf und Alltag', sonst: 'Sonstige Fahrten' }[top.id];
  return `${satz} ${top.id === 'sport' || top.id === 'freizeit' ? 'machen' : 'macht'} ${NF.pct.format(s.kat[top.id] / s.eur)} deiner Ausgaben aus.`;
}

/* ---------- Diagramme (SVG) ---------- */
function schoenAufrunden(v) {
  if (v <= 0) return 10;
  const p = 10 ** Math.floor(Math.log10(v));
  const n = v / p;
  const stufe = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return stufe * p;
}
function kurveDiagramm(z) {
  const tage = daysInMonth(z.ab);
  const vorAb = addMonths(z.ab, -1);
  const vorTage = daysInMonth(vorAb);
  const kum = (ab, n) => {
    const out = []; let a = 0;
    for (let d = 0; d < n; d++) { const t0 = addDays(ab, d); a += summen(inZeit(t0, addDays(t0, 1))).eur; out.push(a); }
    return out;
  };
  const jetzt = new Date();
  const laufend = jetzt >= z.ab && jetzt < z.bis;
  const bisTag = laufend ? jetzt.getDate() : tage;
  const ist = kum(z.ab, bisTag);
  const vor = kum(vorAb, vorTage);
  const b = S.settings.budget || 0;
  const W = 340, H = 180, links = 34, unten = 22, oben = 12, rechts = 8;
  const max = schoenAufrunden(Math.max(b, ...ist, ...vor, 1));
  const x = (d) => links + ((W - links - rechts) * d) / (tage - 1 || 1);
  const y = (v) => oben + (H - oben - unten) * (1 - v / max);
  const pfad = (arr, n) => arr.slice(0, n).map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const bisher = ist.length ? ist[ist.length - 1] : 0;
  const vorGleich = vor[Math.min(vor.length, Math.max(1, ist.length)) - 1] || 0;
  let svg = `<svg class="diagramm" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(`Aufgelaufene Ausgaben: bisher ${eur(bisher)}, im Vormonat bis zum gleichen Tag ${eur(vorGleich)}${b ? `, Budget ${eur(b)}` : ''}`)}">`;
  [0, 0.5, 1].forEach((f) => { svg += `<line class="${f ? 'gitter' : 'achse'}" x1="${links}" x2="${W - rechts}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="${links - 6}" y="${y(max * f) + 4}" text-anchor="end">${NF.int.format(max * f)}</text>`; });
  [1, 10, 20, tage].forEach((d) => { svg += `<text x="${x(d - 1)}" y="${H - 6}" text-anchor="middle">${d}.</text>`; });
  if (b) svg += `<line class="budget-linie" x1="${links}" x2="${W - rechts}" y1="${y(b)}" y2="${y(b)}"/>`;
  svg += `<path class="linie-vor" d="${pfad(vor, Math.min(vorTage, tage))}"/>`;
  if (ist.length) {
    svg += `<path class="flaeche-ist" d="${pfad(ist, ist.length)}L${x(ist.length - 1)},${y(0)}L${x(0)},${y(0)}Z"/>`;
    svg += `<path class="linie-ist" d="${pfad(ist, ist.length)}"/>`;
    const lx = x(ist.length - 1), ly = y(ist[ist.length - 1]);
    svg += `<circle class="punkt" cx="${lx}" cy="${ly}" r="4.5"/><text class="wert-text" x="${Math.min(lx, W - 40)}" y="${ly - 10}" text-anchor="middle">${NF.int.format(ist[ist.length - 1])} €</text>`;
  }
  return svg + '</svg>';
}
function heatmap() {
  const wochen = 16;
  const ende = startOfWeek(new Date());
  const start = addDays(ende, -7 * (wochen - 1));
  const kmTag = {};
  S.trips.forEach((f) => { if (f.t >= +start) { const k = +startOfDay(f.t); kmTag[k] = (kmTag[k] || 0) + f.km; } });
  const zelle = 15, gap = 3, links = 24, oben = 16;
  const W = links + wochen * (zelle + gap), H = oben + 7 * (zelle + gap);
  const stufe = (km) => (km <= 0 ? 0 : km < 15 ? 1 : km < 35 ? 2 : km < 70 ? 3 : 4);
  const fahrtage = Object.keys(kmTag).length;
  const kmSumme = Object.values(kmTag).reduce((a, v) => a + v, 0);
  let svg = `<svg class="diagramm" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(`In den letzten 16 Wochen an ${fahrtage} Tagen gefahren, zusammen ${kmAuto(kmSumme)} km`)}" style="max-width:${W * 1.25}px">`;
  ['Mo', 'Mi', 'Fr', 'So'].forEach((t, i) => { const r = [0, 2, 4, 6][i]; svg += `<text x="0" y="${oben + r * (zelle + gap) + 11}">${t}</text>`; });
  let letzterMonat = -1;
  const heute = startOfDay(new Date());
  for (let w = 0; w < wochen; w++) {
    const wochenStart = addDays(start, w * 7);
    if (wochenStart.getMonth() !== letzterMonat) { letzterMonat = wochenStart.getMonth(); svg += `<text x="${links + w * (zelle + gap)}" y="10">${DF.monatKurz.format(wochenStart).replace('.', '')}</text>`; }
    for (let d = 0; d < 7; d++) {
      const tag = addDays(wochenStart, d);
      if (tag > heute) continue;
      const km = kmTag[+tag] || 0;
      const xx = links + w * (zelle + gap), yy = oben + d * (zelle + gap);
      svg += `<rect class="heat-${stufe(km)}" x="${xx}" y="${yy}" width="${zelle}" height="${zelle}" rx="3"><title>${DF.tagLang.format(tag)}: ${km1(km)} km</title></rect>`;
      if (+tag === +heute) svg += `<rect class="heute" x="${xx - 1}" y="${yy - 1}" width="${zelle + 2}" height="${zelle + 2}" rx="4"/>`;
    }
  }
  svg += '</svg>';
  return `<div style="overflow-x:auto">${svg}</div><div class="heat-skala" aria-hidden="true">weniger <i style="background:var(--heat-0)"></i><i style="background:var(--heat-1)"></i><i style="background:var(--heat-2)"></i><i style="background:var(--heat-3)"></i><i style="background:var(--heat-4)"></i> mehr</div>`;
}
function echterVerbrauch(vehId) {
  const f = S.fills.filter((x) => x.veh === vehId && x.odo > 0).sort((a, b) => a.odo - b.odo);
  const voll = f.filter((x) => x.voll);
  if (voll.length < 2) return null;
  const erst = voll[0], letzt = voll[voll.length - 1];
  const liter = f.filter((x) => x.odo > erst.odo && x.odo <= letzt.odo).reduce((a, x) => a + x.l, 0);
  const km = letzt.odo - erst.odo;
  if (km < 50) return null;
  return { verbrauch: (liter / km) * 100, km, liter };
}

async function tankstellenSheet(fuel) {
  const ks = KRAFTSTOFF[fuel];
  const land = S.settings.land;
  Sheet.open('Tankstellen in der Nähe', lade('Standort wird ermittelt …'));
  const zeige = (html) => { if (Sheet.dlg.open) $('#sheet-inhalt').innerHTML = html; };
  const manuell = `<button class="btn btn-sekundaer btn-breit" type="button" data-action="preis-sheet" data-fuel="${fuel}">Preis von Hand eintragen</button>`;
  if (istOffline()) { zeige(zustandBand('Du bist offline.', ' Live-Preise brauchen Internet. Trag den Preis deiner Tankstelle bis dahin von Hand ein.', false) + manuell); return; }
  if (land === 'DE' && !S.settings.tkKey) {
    zeige(`<p style="margin:0">Für deutsche Live-Preise brauchst du einen kostenlosen Schlüssel von Tankerkönig. Registriere dich auf <b>creativecommons.tankerkoenig.de</b>, kopiere den Schlüssel und trag ihn in der Garage unter Live-Preise ein.</p>
      <a class="btn btn-sekundaer btn-breit" href="https://creativecommons.tankerkoenig.de/" target="_blank" rel="noopener">Tankerkönig öffnen</a>
      <button class="btn btn-sekundaer btn-breit" type="button" data-action="land-at">Stattdessen österreichische Preise nutzen</button>`);
    return;
  }
  let pos;
  try { pos = await standortHolen(); } catch (e) {
    const zuhause = S.places[0];
    if (zuhause) pos = { lat: zuhause.lat, lon: zuhause.lon, ersatz: zuhause.name };
    else {
      zeige((IM_RAHMEN
        ? zustandBand('Standort in der Vorschau gesperrt.', ' In der installierten App fragt dein iPhone nach der Erlaubnis.', true)
        : e && e.code === 1
        ? zustandBand('Standortzugriff nicht erlaubt.', ' Erlaube ihn in den iPhone-Einstellungen unter Datenschutz & Sicherheit, Ortungsdienste, oder merke dir unter Route einen Ort wie „Zuhause“.', true)
        : zustandBand('Kein Standort gefunden.', ' Versuch es gleich noch einmal oder merke dir unter Route einen Ort wie „Zuhause“.', true)) + manuell);
      return;
    }
  }
  zeige(lade('Preise werden geladen …') + '<span class="skelett" style="height:3rem"></span><span class="skelett" style="height:3rem"></span><span class="skelett" style="height:3rem"></span>');
  try {
    let liste = [];
    if (land === 'DE') {
      const r = await holeJson(`https://creativecommons.tankerkoenig.de/json/list.php?lat=${pos.lat.toFixed(5)}&lng=${pos.lon.toFixed(5)}&rad=${S.settings.radius || 5}&sort=price&type=${ks.tk}&apikey=${encodeURIComponent(S.settings.tkKey)}`, 10000);
      if (!r.ok) throw new Error(r.message || 'Fehler');
      liste = (r.stations || []).filter((x) => typeof x.price === 'number' && x.price > 0).map((x) => ({ name: x.brand || x.name, adr: `${x.street || ''} ${x.houseNumber || ''}, ${x.place || ''}`.trim(), dist: x.dist, price: x.price, offen: x.isOpen }));
    } else {
      const r = await holeJson(`https://api.e-control.at/sprit/1.0/search/gas-stations/by-address?latitude=${pos.lat.toFixed(5)}&longitude=${pos.lon.toFixed(5)}&fuelType=${ks.at}&includeClosed=false`, 10000);
      liste = (Array.isArray(r) ? r : []).filter((x) => x.prices && x.prices.length).map((x) => ({ name: x.name, adr: `${x.location?.address || ''}, ${x.location?.city || ''}`, dist: x.distance, price: x.prices[0].amount, offen: x.open !== false })).sort((a, b) => a.price - b.price);
    }
    if (!liste.length) { zeige(zustandBand('Keine Preise in der Nähe.', ` Im Umkreis von ${S.settings.radius || 5} km meldet gerade keine Tankstelle einen Preis für ${esc(ks.name)}.`, false) + manuell); return; }
    zeige(`${pos.ersatz ? `<p class="hinweis" style="margin:0">Ohne Standortfreigabe gesucht um: ${esc(pos.ersatz)}</p>` : ''}
      <div class="liste">${liste.slice(0, 10).map((x, i) => `<button class="zeile" type="button" data-station="${i}"><span class="z-text"><span class="z-titel" style="display:block">${esc(x.name)}</span><span class="z-sub" style="display:block">${esc(x.adr)}${typeof x.dist === 'number' ? `, ${NF.d1.format(x.dist)} km` : ''}</span></span><span class="z-wert preis">${preisHtml(x.price)} €</span></button>`).join('')}</div>
      <p class="hinweis" style="margin:0">${land === 'DE' ? 'Preisdaten: Tankerkönig, MTS-K, Lizenz CC BY 4.0.' : 'Preisdaten: E-Control Spritpreisrechner.'} Tippe eine Tankstelle an, um ihren Preis zu übernehmen.</p>`);
    $('#sheet-inhalt').onclick = (e) => {
      const b = e.target.closest('[data-station]'); if (!b) return;
      const x = liste[+b.dataset.station];
      S.prices[fuel] = { p: round(x.price, 3), station: x.name, t: Date.now(), src: land === 'DE' ? 'tankerkoenig' : 'econtrol' };
      $('#sheet-inhalt').onclick = null;
      speichern(); Sheet.close(); neuZeichnen(); toast(`Preis von ${x.name} übernommen`);
    };
  } catch (e) {
    zeige(zustandBand('Preise nicht geladen.', ' ' + (IM_RAHMEN ? 'Live-Preise sind in dieser Vorschau gesperrt. In der installierten App funktionieren sie.' : 'Prüfe den Tankerkönig-Schlüssel und die Internetverbindung.'), true) + manuell);
  }
}

async function dateiAnbieten(name, text, mime) {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) {
        await dl.save({ filename: name, data: text });
        toast('Datei gesichert');
        return;
      }
    }
  } catch (e) {
    if (e && e.code === 'declined') return;
  }
  const datei = new File([text], name, { type: mime });
  if (IST_IOS && navigator.canShare && navigator.canShare({ files: [datei] })) {
    try { await navigator.share({ files: [datei], title: name }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try {
    const url = URL.createObjectURL(datei);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) {
    toast('Speichern hier nicht möglich.');
  }
}
function exportJson() {
  const datum = new Date().toISOString().slice(0, 10);
  dateiAnbieten(`zaehlwerk-backup-${datum}.json`, JSON.stringify({ app: 'Zählwerk', exportiert: new Date().toISOString(), daten: S }, null, 1), 'application/json');
}
function exportCsv() {
  const kopf = ['Datum', 'Uhrzeit', 'Bezeichnung', 'Zweck', 'km', 'Menge', 'Preis je Einheit', 'Spritkosten', 'Maut und Parken', 'Verschleiß', 'Gesamt', 'Personen', 'Dein Anteil', 'Fahrzeug', 'Notiz'];
  const zelle = (v) => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const zeilen = S.trips.slice().sort((a, b) => a.t - b.t).map((f) => {
    const d = new Date(f.t);
    return [DF.datum.format(d), DF.zeit.format(d), f.titel, katName(f.kat), NF.d1.format(f.km), NF.d2.format(f.menge), NF.d3.format(f.p), NF.d2.format(f.sprit), NF.d2.format(f.extra), NF.d2.format(f.verschleiss || 0), NF.d2.format(f.gesamt), f.pers, NF.d2.format(anteil(f)), f.vehName, f.notiz].map(zelle).join(';');
  });
  dateiAnbieten(`zaehlwerk-fahrten-${new Date().toISOString().slice(0, 10)}.csv`, '﻿' + [kopf.join(';'), ...zeilen].join('\r\n'), 'text/csv');
}
function importieren(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const roh = JSON.parse(reader.result);
      const d = roh.daten || roh;
      if (!d || !Array.isArray(d.trips) || !Array.isArray(d.vehicles)) throw new Error('Format');
      Sheet.open('Backup einspielen', `<p style="margin:0">Das Backup enthält <b>${d.trips.length} Fahrten</b> und <b>${d.vehicles.length} ${d.vehicles.length === 1 ? 'Fahrzeug' : 'Fahrzeuge'}</b>${roh.exportiert ? ` vom ${DF.datum.format(new Date(roh.exportiert))}` : ''}. Deine aktuellen Daten auf diesem Gerät werden dabei ersetzt.</p>
        <button class="btn btn-primaer btn-breit" type="button" id="i-ok">Backup einspielen</button>`, (root) => {

    } catch (err) {
      toast('Diese Datei ist kein Zählwerk-Backup.');

  };
  reader.readAsText(file);
}

const RENDER = { rechnen: renderRechnen, route: renderRoute, fahrten: renderFahrten, bilanz: renderBilanz, garage: renderGarage };
function sheetZiehen() {
  const d = Sheet.dlg;
  let y0 = null, dy = 0;
  d.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('.sheet-griff, .sheet-kopf') || e.target.closest('button')) return;
    y0 = e.clientY; dy = 0;
    d.style.transition = 'none';
    try { d.setPointerCapture(e.pointerId); } catch (err) { /* egal */ }
  });
  d.addEventListener('pointermove', (e) => {
    if (y0 === null) return;
    dy = Math.max(0, e.clientY - y0);
    d.style.transform = `translateY(${dy}px)`;
  });
  const ende = () => {
    if (y0 === null) return;
    y0 = null;
    d.style.transition = WENIG_BEWEGUNG ? 'none' : 'transform .22s ease';
    if (dy > 110) {
      d.style.transform = 'translateY(100%)';
      setTimeout(() => { Sheet.close(); d.style.transform = ''; d.style.transition = ''; }, WENIG_BEWEGUNG ? 0 : 200);
    } else d.style.transform = '';
  };
  d.addEventListener('pointerup', ende);
  d.addEventListener('pointercancel', ende);
}
function start() {
  if (!ROOT.getAttribute('lang')) ROOT.setAttribute('lang', 'de');
  // Dynamic Type: große Textgrößen ja, aber so begrenzt, dass das Zählwerk noch passt
  const basis = parseFloat(getComputedStyle(ROOT).fontSize) || 16;
  if (basis > 21) ROOT.style.fontSize = '21px';
  else if (basis < 15) ROOT.style.fontSize = '15px';
  window.addEventListener('offline', () => { toast('Offline: Rechner, Fahrten und Bilanz funktionieren weiter.'); routeStatus(); });
  window.addEventListener('online', () => { toast('Wieder online'); routeStatus(); if (Karte.aus && Karte.map) { Karte.aus = false; Karte.kachelnSetzen(); kartenStatus(); } });
  Sheet.dlg = $('#sheet');
  sheetZiehen();
  Sheet.dlg.addEventListener('click', (e) => { if (e.target === Sheet.dlg) Sheet.close(); });
  Sheet.dlg.addEventListener('close', () => { if (Sheet.onClose) Sheet.onClose(); $('#sheet-inhalt').onclick = null; });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-action]');
    if (!b || b.disabled) return;
    const fn = AKTION[b.dataset.action];
    if (fn) { e.preventDefault(); fn(b, e); }
  });
  tabsBauen();
  themeAnwenden();
  if (window.matchMedia) {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const neu = () => { if (S.settings.theme === 'auto') themeAnwenden(); };
    if (mq.addEventListener) mq.addEventListener('change', neu); else if (mq.addListener) mq.addListener(neu);
  }
  new MutationObserver(() => {
    const soll = S.settings.theme === 'hell' ? 'light' : S.settings.theme === 'dunkel' ? 'dark' : null;
    if (soll && ROOT.getAttribute('data-theme') !== soll) { ROOT.setAttribute('data-theme', soll); return; }
    if (Karte.map) Karte.kachelnSetzen();
  }).observe(ROOT, { attributes: true, attributeFilter: ['data-theme'] });
  const hash = (location.hash || '').replace('#', '');
  const ersterTab = TABS.some((t) => t.id === hash) ? hash : (S.ui.tab || 'rechnen');
  zeigeTab(ersterTab, true);
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (TABS.some((t) => t.id === h) && h !== S.ui.tab) zeigeTab(h); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.ui.tab === 'rechnen') rechnerAktualisieren(); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>

if (navigator.serviceWorker && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
